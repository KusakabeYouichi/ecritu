name: iOS CI

# git に入っている状態だけから Release ビルドが通るかを見る(3408)。
# テストは回さない: 変換のテストは tmp/(git 管理外、約 1.9GB)から作る辞書が前提で、ここでは用意できない。
# 全網テストは手元でコミット前に回す。ここで拾いたいのは手元では気づけない失敗
# (pbxproj の登録漏れ・コミットし忘れ・新しい clone だけで壊れる設定・Release だけのコンパイラ異常終了)
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# CI は検査だけなので、渡される鍵は読み取りだけにする(3412)
permissions:
  contents: read

jobs:
  release-build:
    # macos-26 には Xcode 26 しか無い。Xcode 27 は専用イメージ(公開プレビュー)にある
    runs-on: xcode-27
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 手元と同じ 27.0 に固定する(イメージには 27.1 / 27.2 beta も入っている)
      - name: Select Xcode 27.0
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version

      - name: Normalize shared scheme
        run: bash tools/normalize_unicode_project_names.sh

      - name: Swift style check
        run: bash tools/check_top_level_brace_blank_lines.sh

      - name: Release build
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "écritu.xcodeproj" \
            -scheme "écritu" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "build-ci" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
