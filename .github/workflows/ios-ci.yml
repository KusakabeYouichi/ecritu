name: iOS CI

# git に入っている状態だけから Release ビルドが通るかを見る(3408)。
# テストは回さない: 変換のテストは tmp/(git 管理外、約 1.9GB)から作る辞書が前提で、ここでは用意できない。
# 全網テストは手元でコミット前に回す。ここで拾いたいのは手元では気づけない失敗
# (pbxproj の登録漏れ・コミットし忘れ・新しい clone だけで壊れる設定・Release だけのコンパイラ異常終了)
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-build:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27
        shell: bash
        run: |
          set -euo pipefail

          XCODE_APP="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)"

          if [[ -z "$XCODE_APP" ]]; then
            echo "Xcode 27 not found on this runner" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Normalize shared scheme
        run: bash tools/normalize_unicode_project_names.sh

      - name: Swift style check
        run: bash tools/check_top_level_brace_blank_lines.sh

      - name: Release build
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "écritu.xcodeproj" \
            -scheme "écritu" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "build-ci" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
