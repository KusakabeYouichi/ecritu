<h1>écritu を入れました</h1>
<p><b>[このコンピュータのすべてのユーザ用にインストール] を選んだときは、いったんログアウトして、ログインし直してください。</b>ログインし直すまで、入力ソースの一覧に『écritu』が出ません。</p>
<p>[自分専用にインストール] を選んだときは、そのまま次へ進めます。</p>
<p>そのあと、[システム設定] &gt; [キーボード] &gt; [入力ソース] の [編集…] を開き、[+] &gt; [日本語] から『écritu』を追加してください。</p>
