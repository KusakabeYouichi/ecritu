<title>活用で入れ替わる並び</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: 1 列の読みカード。上に件数と絞り込み、下に結果コピー */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #1d2330; --muted: #5d6677; --line: #dde1e8;
  --accent: #2f5fb3; --flip-bg: #fff1d6; --flip-fg: #8a4b00; --ok: #2e7d4f; --fix: #b3372f;
  --font-body: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14171d; --surface: #1c2029; --fg: #e6e9ef; --muted: #9aa3b4; --line: #2e3442;
  --accent: #7aa2ec; --flip-bg: #3a2c12; --flip-fg: #f2c27a; --ok: #6fcf97; --fix: #f08a80; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14171d; --surface: #1c2029; --fg: #e6e9ef; --muted: #9aa3b4; --line: #2e3442;
  --accent: #7aa2ec; --flip-bg: #3a2c12; --flip-fg: #f2c27a; --ok: #6fcf97; --fix: #f08a80; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; }
h1 { font-size: 1.4rem; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; max-width: 70ch; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.bar label { display: inline-flex; gap: 6px; align-items: center; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); }
.list { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: grid; gap: 8px; min-width: 0; }
.card[data-mark="fix"] { border-color: var(--fix); }
.card[data-mark="ok"] { opacity: .6; }
.head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.reading { font-size: 1.1rem; font-weight: 600; }
.kind { font-size: .75rem; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
.forms { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td, th { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 500; color: var(--muted); font-size: .8rem; }
tr.flip td { background: var(--flip-bg); color: var(--flip-fg); }
tr.flip td:first-child::after { content: " 入れ替わり"; font-size: .72rem; }
.rd { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.decide { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.decide input[type=text] { flex: 1 1 220px; min-width: 0; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.out { width: 100%; min-height: 120px; font-family: var(--font-mono); font-size: .8rem; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; box-sizing: border-box; }
.note { color: var(--muted); font-size: .85rem; }
</style>

<div class="wrap">
  <h1>活用で入れ替わる並び</h1>
  <p class="lede">基本形(する/終止形)と比べて、活用形で候補の先頭か2番めが入れ替わる読みです。行ごとに上位3件の漢字の頭を並べ、入れ替わった形に色を付けています。直したい読みは[直す]を選び、希望の並びを書いてください(例: 辞任、自認、自任)。最後に[結果をコピー]で文字にして、会話に貼り付けてください。</p>
  <div class="bar">
    <label><input type="radio" name="kindf" id="kind-all" value="all" checked> すべて</label>
    <label><input type="radio" name="kindf" id="kind-suru" value="suru"> サ変(〜する)</label>
    <label><input type="radio" name="kindf" id="kind-godan" value="godan"> 五段</label>
    <label><input type="checkbox" id="hide-ok"> [このままでよい]を隠す</label>
    <span class="count" id="count"></span>
  </div>
  <p class="note">頭の取り出しは『最初のひらがなの手前まで』なので、受付→受 のように崩れる行があります。並びを見る目安としてお使いください。</p>
  <div class="list" id="list"></div>
  <div class="bar" style="flex-direction:column;align-items:stretch">
    <div class="decide"><button type="button" id="copy">結果をコピー</button><span class="note" id="copied"></span></div>
    <textarea class="out" id="out" readonly aria-label="結果"></textarea>
  </div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
const rows = JSON.parse(document.getElementById('data').textContent);
rows.forEach((r, i) => { r.docId = r.kind + '-' + String(i).padStart(3, '0'); });
let state = {};          // docId -> {mark, order}
let decisions = null;    // db collection (null = 保存できない)
const saveTimers = {};
function setStatus(text) { document.getElementById('status').textContent = text; }
function persist(r) {
  const s = state[r.docId] || {};
  if (!decisions) { return; }
  clearTimeout(saveTimers[r.docId]);
  saveTimers[r.docId] = setTimeout(() => {
    decisions.doc(r.docId).set({ kind: r.kind, reading: r.reading, mark: s.mark || '', order: s.order || '' })
      .then(() => setStatus('保存しました'))
      .catch(() => setStatus('保存できませんでした。もう一度選び直してください'));
  }, 500);
}
const list = document.getElementById('list');
function render() {
  const kind = document.querySelector('input[name=kindf]:checked').value;
  const hideOk = document.getElementById('hide-ok').checked;
  list.textContent = '';
  let shown = 0;
  rows.forEach((r, i) => {
    const s = state[r.docId] || {};
    if (kind !== 'all' && r.kind !== kind) return;
    if (hideOk && s.mark === 'ok') return;
    shown++;
    const card = document.createElement('section');
    card.className = 'card';
    if (s.mark) card.dataset.mark = s.mark;
    const head = document.createElement('div'); head.className = 'head';
    head.innerHTML = '<span class="reading"></span><span class="kind"></span>';
    head.querySelector('.reading').textContent = r.reading;
    head.querySelector('.kind').textContent = r.kind === 'suru' ? 'サ変' : '五段';
    card.appendChild(head);
    const box = document.createElement('div'); box.className = 'forms';
    const t = document.createElement('table');
    t.innerHTML = '<tr><th>形</th><th>読み</th><th>1</th><th>2</th><th>3</th></tr>';
    r.forms.forEach(f => {
      const tr = document.createElement('tr'); if (f.flip) tr.className = 'flip';
      const cells = [f.label, f.reading, f.heads[0] || '', f.heads[1] || '', f.heads[2] || ''];
      cells.forEach((c, j) => { const td = document.createElement('td'); td.textContent = c; if (j === 1) td.className = 'rd'; tr.appendChild(td); });
      t.appendChild(tr);
    });
    box.appendChild(t); card.appendChild(box);
    const d = document.createElement('div'); d.className = 'decide';
    ['fix', 'ok'].forEach(m => {
      const lab = document.createElement('label');
      const inp = document.createElement('input'); inp.type = 'radio'; inp.name = 'm' + i; inp.id = 'm' + i + m; inp.checked = s.mark === m;
      inp.addEventListener('change', () => { state[r.docId] = Object.assign({}, state[r.docId], { mark: m }); card.dataset.mark = m; persist(r); updateOut(); });
      lab.appendChild(inp); lab.append(m === 'fix' ? ' 直す' : ' このままでよい'); d.appendChild(lab);
    });
    const txt = document.createElement('input'); txt.type = 'text'; txt.id = 'o' + i; txt.placeholder = '希望の並び(例: 辞任、自認、自任)'; txt.value = s.order || '';
    txt.addEventListener('input', () => {
      state[r.docId] = Object.assign({}, state[r.docId], { order: txt.value });
      if (txt.value && !state[r.docId].mark) { state[r.docId].mark = 'fix'; card.dataset.mark = 'fix'; const fx = document.getElementById('m' + i + 'fix'); if (fx) fx.checked = true; }
      persist(r); updateOut();
    });
    d.appendChild(txt); card.appendChild(d);
    list.appendChild(card);
  });
  updateCount(shown);
}
let lastShown = 0;
function updateCount(shown) {
  if (shown !== undefined) lastShown = shown;
  const decided = rows.filter(r => (state[r.docId] || {}).mark).length;
  document.getElementById('count').textContent = '表示 ' + lastShown + ' / ' + rows.length + ' 件・未入力 ' + (rows.length - decided) + ' 件';
}
function updateOut() {
  const lines = [];
  rows.forEach(r => {
    const s = state[r.docId];
    if (!s || !s.mark) return;
    lines.push((s.mark === 'fix' ? '直す' : 'OK') + '\t' + r.reading + (s.order ? '\t' + s.order : ''));
  });
  document.getElementById('out').value = lines.join('\n');
  updateCount();
}
document.querySelectorAll('input[name=kindf]').forEach(el => el.addEventListener('change', render));
document.getElementById('hide-ok').addEventListener('change', render);
document.getElementById('copy').addEventListener('click', () => {
  const out = document.getElementById('out'); const msg = document.getElementById('copied');
  navigator.clipboard.writeText(out.value).then(() => { msg.textContent = 'コピーしました'; })
    .catch(() => { out.focus(); out.select(); msg.textContent = '選択しました。コピーしてください'; });
});
render(); updateOut();
setStatus('保存先に接続しています…');
(async () => {
  const db = window.claude ? await window.claude.use('db') : null;
  if (!db) { setStatus('保存できない表示です(サインインしていないなど)。入力はページを閉じると消えます'); return; }
  decisions = db.collection('decisions');
  let first = true;
  decisions.onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(doc => { const v = doc.data() || {}; next[doc.id] = { mark: v.mark || '', order: v.order || '' }; });
    // 入力中の欄は上書きしない(自分の書き込みが戻ってくるまでの間)
    const active = document.activeElement;
    state = Object.assign({}, state, next);
    if (first || !(active && active.tagName === 'INPUT' && active.type === 'text')) { render(); }
    updateOut();
    if (first) { setStatus('claude.ai に自動保存されます(どの端末から開いても同じ内容です)'); first = false; }
  }, () => setStatus('保存先との接続が切れました。再読み込みしてください'));
})();
</script>
